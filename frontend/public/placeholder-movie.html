<!DOCTYPE html>
<html>
<head>
    <title>Movie Image Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1f2937, #374151);
            font-family: 'Inter', sans-serif;
        }
        .placeholder {
            width: 400px;
            height: 600px;
            background: linear-gradient(135deg, #374151, #4b5563);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .movie-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .text {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="movie-icon">🎬</div>
        <div class="text">Movie Poster</div>
    </div>
</body>
</html>
